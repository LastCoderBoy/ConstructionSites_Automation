name: API Test Suite — QurilishNazorat

on:
  push:
    branches:
      - main
      - master
      - develop

  pull_request:
    branches:
      - main
      - master
      - develop

  # Manual trigger — optionally override the target URL
  workflow_dispatch:
    inputs:
      base_url:
        description: "Target API base URL (leave blank to use secret)"
        required: false
        default: ""

# Cancel in-progress runs on the same branch when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "25"
  JAVA_DISTRIBUTION: "temurin"

jobs:

  # ============================================================
  #  JOB 1 — Compile & validate
  #  Runs on GitHub-hosted cloud runner (no network calls).
  #  Fast gate: catches compile errors before we bother running
  #  tests on the self-hosted runner.
  # ============================================================
  compile:
    name: Compile & Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Compile test sources
        run: ./mvnw test-compile --no-transfer-progress

  # ============================================================
  #  JOB 2 — Run API tests
  #
  #  IMPORTANT: This job MUST run on a self-hosted runner located
  #  in Uzbekistan. The target API enforces geo-IP blocking and
  #  returns 403 for all non-UZ IPs including GitHub's cloud runners (US-based).
  #
  #  Setup instructions:
  #    1. Go to your repo → Settings → Actions → Runners
  #    2. Click "New self-hosted runner"
  #    3. Follow the install steps on your UZ server / local machine
  #    4. Give the runner the label:  uzbekistan
  #    5. Start the runner service
  # ============================================================
  test:
    name: Run API Tests (self-hosted / UZ)
    runs-on: [self-hosted, uzbekistan]
    needs: compile           # only run if compile passes
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      # Resolve BASE_URL: manual input → repo secret
      - name: Resolve target base URL
        run: |
          INPUT_URL="${{ github.event.inputs.base_url }}"
          if [ -n "$INPUT_URL" ]; then
            echo "BASE_URL=$INPUT_URL" >> $GITHUB_ENV
            echo "Using manually provided URL: $INPUT_URL"
          else
            echo "BASE_URL=${{ secrets.BASE_URL }}" >> $GITHUB_ENV
            echo "Using BASE_URL from repository secret"
          fi

      # Health check — verify the API is reachable before running 109 tests.
      # If the backend is down (502) we fail here immediately with a clear
      # message instead of seeing 109 cryptic content-type / status-code errors.
      # Retries every 10s for up to 2 minutes (12 attempts).
      - name: API health check (wait for server to be ready)
        run: |
          HEALTH_URL="${BASE_URL}/api/v1/districts/summary"
          MAX_RETRIES=12
          RETRY_INTERVAL=10
          attempt=1

          echo "Checking API health at: $HEALTH_URL"

          until [ $attempt -gt $MAX_RETRIES ]; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "Accept: application/json" \
              --connect-timeout 5 \
              --max-time 10 \
              "$HEALTH_URL")

            echo "Attempt $attempt/$MAX_RETRIES — HTTP $STATUS"

            if [ "$STATUS" = "200" ] || [ "$STATUS" = "304" ]; then
              echo "API is healthy (HTTP $STATUS). Proceeding with tests."
              exit 0
            fi

            if [ "$STATUS" = "403" ]; then
              echo "ERROR: API returned 403 Forbidden."
              echo "This runner's IP is geo-blocked. Ensure this job runs on a UZ-based self-hosted runner."
              exit 1
            fi

            echo "API not ready yet (HTTP $STATUS). Retrying in ${RETRY_INTERVAL}s..."
            sleep $RETRY_INTERVAL
            attempt=$((attempt + 1))
          done

          echo "ERROR: API did not become healthy after $((MAX_RETRIES * RETRY_INTERVAL))s."
          echo "Last HTTP status: $STATUS — backend (nginx upstream) appears to be down."
          exit 1
        env:
          BASE_URL: ${{ env.BASE_URL }}

      - name: Run REST Assured test suite
        run: ./mvnw test --no-transfer-progress
        env:
          BASE_URL: ${{ env.BASE_URL }}


      # Upload raw Allure results — always (even on failure)
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ github.run_number }}
          path: target/allure-results/
          retention-days: 30

      # Upload Surefire XML — for GitHub test summary tab
      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ github.run_number }}
          path: target/surefire-reports/
          retention-days: 7

  # ============================================================
  #  JOB 3 — Build & publish Allure HTML report
  #  Runs on GitHub cloud (no API calls needed — just builds HTML).
  #  Always runs after the test job.
  # ============================================================
  report:
    name: Publish Allure Report
    runs-on: ubuntu-latest
    needs: test
    if: always()
    timeout-minutes: 10

    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-${{ github.run_number }}
          path: target/allure-results/

      - name: Generate Allure HTML report
        run: ./mvnw allure:report --no-transfer-progress

      # Publish to GitHub Pages — only from main / master
      - name: Deploy report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: target/site/allure-maven-plugin
          publish_branch: gh-pages
          destination_dir: allure-report
          keep_files: false
          commit_message: "ci: update Allure report [run #${{ github.run_number }}]"

      # Also upload as a downloadable artifact for all branches / PRs
      - name: Upload HTML report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ github.run_number }}
          path: target/site/allure-maven-plugin/
          retention-days: 30
